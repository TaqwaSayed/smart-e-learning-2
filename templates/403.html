{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — {% trans "Permission denied" %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container" style="display:flex;align-items:center;justify-content:center;min-height:80vh;">
        <div class="card" style="text-align:center;max-width:480px;">
            <div style="font-size:44px;margin-bottom:10px;"><i class="bi bi-shield-lock-fill" style="color:var(--danger);"></i></div>
            <h1 style="margin-bottom:10px;">403</h1>
            <p style="color:var(--ink-dim);margin-bottom:20px;">
                {% trans "You don't have permission to do that. This action is restricted to the instructor who owns this course." %}
            </p>
            <a class="btn btn-primary" href="/">{% trans "Back to dashboard" %}</a>
        </div>
    </div>
</body>
</html>
